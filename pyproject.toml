[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperqa-reflect"
version = "0.1.0"
description = "Reproducible local PaperQA experiments for UiA IKT464"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "paper-qa",
    "httpx>=0.28",
    "pypdf>=6",
    "fhlmi==0.45.0",
]

[dependency-groups]
data = [
    "pyarrow==25.0.1",
]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
pqa-reflect = "paperqa_reflect.cli:main"

[tool.uv.sources]
paper-qa = {git = "https://github.com/Future-House/paper-qa.git", rev = "57e89f7223b0960d5ee5ea048c69e3c47e088572"}

[tool.hatch.build.targets.wheel]
packages = ["src/paperqa_reflect"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
